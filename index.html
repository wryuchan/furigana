<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ふりがな付与ツール | wataryuu.com</title>
    <meta
      name="description"
      content="日本語テキストを解析し、HTML5 ruby タグ形式のふりがな付き HTML をブラウザ内で生成するツールです。"
    />
    <meta name="theme-color" content="#f7f4ee" />
    <link rel="canonical" href="https://wataryuu.com/furigana/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f4ee;
        --surface: #ffffff;
        --surface-soft: #f1ede5;
        --line: #ddd6ca;
        --line-strong: #cfc7ba;
        --text: #1f1d1a;
        --muted: #676156;
        --accent: #2e5aac;
        --accent-soft: #eef4ff;
        --shadow: 0 14px 34px rgba(34, 29, 22, 0.06);
        --radius-lg: 24px;
        --radius-md: 18px;
        --content-width: min(980px, calc(100vw - 32px));
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "IBM Plex Sans JP", sans-serif;
        background:
          radial-gradient(circle at top right, rgba(46, 90, 172, 0.07), transparent 24%),
          linear-gradient(180deg, #fbfaf7 0%, var(--bg) 100%);
      }

      a {
        color: inherit;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(46, 90, 172, 0.26);
        outline-offset: 3px;
      }

      .page {
        width: var(--content-width);
        margin: 0 auto;
        padding: 26px 0 56px;
      }

      .site-header {
        padding-bottom: 24px;
        border-bottom: 1px solid var(--line);
      }

      .title-wrap {
        display: grid;
        gap: 10px;
      }

      .eyebrow {
        display: inline-flex;
        width: fit-content;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3.8rem);
        line-height: 1.08;
        letter-spacing: -0.03em;
      }

      .lead {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.9;
      }

      main {
        display: grid;
        gap: 22px;
        padding-top: 28px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.88);
        box-shadow: var(--shadow);
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding: 20px 22px 0;
      }

      .panel-title {
        font-size: 1.16rem;
        line-height: 1.35;
      }

      .panel-body {
        display: grid;
        gap: 14px;
        padding: 18px 22px 22px;
      }

      textarea,
      input[type="text"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        color: var(--text);
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      textarea {
        padding: 16px;
        line-height: 1.8;
      }

      #sourceText,
      #outputHtml {
        min-height: 62px;
        resize: none;
        overflow-y: hidden;
      }

      #sourceText::placeholder,
      #outputHtml::placeholder {
        color: var(--muted);
        opacity: 1;
      }

      .preview.is-sample,
      #outputHtml.is-sample {
        color: var(--muted);
      }

      textarea:focus,
      input[type="text"]:focus {
        border-color: rgba(46, 90, 172, 0.55);
        box-shadow: 0 0 0 4px rgba(46, 90, 172, 0.1);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid transparent;
        border-radius: 999px;
        font-weight: 700;
        transition:
          background 170ms ease,
          border-color 170ms ease,
          color 170ms ease,
          transform 170ms ease;
      }

      .button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .button-primary {
        background: var(--accent);
        color: #fff;
      }

      .button-secondary {
        border-color: var(--line);
        background: #faf8f4;
        color: var(--text);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        font-size: 0.92rem;
      }

      .status::before {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
      }

      .status-error {
        color: #8c2f25;
      }

      .status-error::before {
        background: #b63c2f;
      }

      .token-list {
        display: grid;
        gap: 10px;
      }

      .empty {
        padding: 18px;
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius-md);
        background: #faf8f4;
        color: var(--muted);
        line-height: 1.8;
      }

      .token-row {
        display: grid;
        grid-template-columns: minmax(120px, 0.8fr) minmax(230px, 1.2fr) minmax(220px, auto);
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: #fff;
      }

      .token-surface {
        display: flex;
        min-height: 42px;
        align-items: center;
        padding: 9px 11px;
        border-radius: 12px;
        background: var(--surface-soft);
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .reading-field {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .reading-field input {
        min-height: 42px;
        padding: 0 12px;
      }

      .char-readings {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .char-reading-field {
        display: grid;
        grid-template-columns: auto minmax(74px, 1fr);
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .char-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 34px;
        min-height: 34px;
        padding: 0 8px;
        border-radius: 10px;
        background: var(--surface-soft);
        color: var(--text);
        font-size: 1rem;
      }

      .char-reading-field input {
        width: 86px;
        min-height: 38px;
        padding: 0 10px;
      }

      .muted-label {
        min-height: 42px;
        display: flex;
        align-items: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .segment {
        display: inline-flex;
        width: fit-content;
        max-width: 100%;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
      }

      .segment button {
        min-height: 40px;
        padding: 0 15px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-weight: 700;
        transition:
          background 160ms ease,
          color 160ms ease;
      }

      .segment button[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
      }

      .style-segment {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #faf8f4;
      }

      .style-segment button {
        min-height: 34px;
        padding: 0 9px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        transition:
          background 160ms ease,
          color 160ms ease;
      }

      .style-segment button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .preview {
        min-height: 62px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: #fff;
        font-size: clamp(1.18rem, 2.6vw, 1.55rem);
        line-height: 2.1;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      rt {
        color: var(--accent);
        font-size: 0.52em;
        font-weight: 600;
      }

      .output-row {
        display: grid;
        gap: 12px;
      }

      .output-row textarea {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92rem;
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 10;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--text);
        color: #fff;
        box-shadow: 0 16px 36px rgba(34, 29, 22, 0.18);
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
        pointer-events: none;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 12px 16px;
        padding-top: 28px;
        margin-top: 28px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.92rem;
      }

      .footer a {
        color: var(--text);
      }

      @media (max-width: 760px) {
        .site-header,
        .panel-head,
        .footer {
          flex-direction: column;
          align-items: flex-start;
        }

        .token-row {
          grid-template-columns: 1fr;
        }

        .segment {
          display: grid;
          width: 100%;
          border-radius: 18px;
        }

        .segment button {
          border-radius: 14px;
        }
      }

      @media (max-width: 520px) {
        .page {
          width: min(100vw - 20px, 980px);
          padding-top: 18px;
        }

        .panel-head,
        .panel-body {
          padding-left: 16px;
          padding-right: 16px;
        }

        .actions,
        .button {
          width: 100%;
        }

        .toast {
          right: 10px;
          bottom: 10px;
          left: 10px;
          text-align: center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="title-wrap">
          <span class="eyebrow">Text Tool</span>
          <h1>ふりがな付与ツール</h1>
          <p class="lead">
            入力した日本語テキストを形態素解析し、HTML5 ruby タグの文字列を生成します。読みやルビの有無はトークンごとに調整できます。
          </p>
        </div>
      </header>

      <main>
        <section class="panel" aria-labelledby="range-title">
          <div class="panel-head">
            <h2 class="panel-title" id="range-title">ルビ範囲</h2>
          </div>
          <div class="panel-body">
            <div class="segment" role="group" aria-label="ルビ範囲">
              <button type="button" id="monoModeButton" aria-pressed="false">モノルビ</button>
              <button type="button" id="groupModeButton" aria-pressed="true">グループルビ</button>
              <button type="button" id="wholeModeButton" aria-pressed="false">語まるごと</button>
            </div>
          </div>
        </section>

        <section class="panel" aria-labelledby="input-title">
          <div class="panel-head">
            <h2 class="panel-title" id="input-title">入力</h2>
            <div class="status" id="status">辞書を読み込んでいます</div>
          </div>
          <div class="panel-body">
            <textarea id="sourceText" placeholder="例: 新幹線で旅行を楽しむ。"></textarea>
            <div class="actions">
              <button class="button button-primary" id="convertButton" type="button" disabled>変換</button>
            </div>
          </div>
        </section>

        <section class="panel" aria-labelledby="preview-title">
          <div class="panel-head">
            <h2 class="panel-title" id="preview-title">プレビュー</h2>
          </div>
          <div class="panel-body">
            <div class="preview is-sample" id="preview" aria-live="polite">例: <ruby>新幹線<rt>しんかんせん</rt></ruby>で<ruby>旅行<rt>りょこう</rt></ruby>を<ruby>楽<rt>たの</rt></ruby>しむ。</div>
          </div>
        </section>

        <section class="panel" aria-labelledby="output-title">
          <div class="panel-head">
            <h2 class="panel-title" id="output-title">出力</h2>
          </div>
          <div class="panel-body output-row">
            <div class="segment" role="group" aria-label="出力フォーマット">
              <button type="button" id="formatHtmlButton" aria-pressed="true">HTML5 ruby</button>
              <button type="button" id="formatAozoraButton" aria-pressed="false">青空文庫記法</button>
              <button type="button" id="formatPixivButton" aria-pressed="false">pixiv</button>
            </div>
            <textarea class="is-sample" id="outputHtml" readonly aria-label="生成HTML">例: <ruby>新幹線<rt>しんかんせん</rt></ruby>で<ruby>旅行<rt>りょこう</rt></ruby>を<ruby>楽<rt>たの</rt></ruby>しむ。</textarea>
            <div class="actions">
              <button class="button button-secondary" id="copyButton" type="button">コピー</button>
            </div>
          </div>
        </section>

        <section class="panel" aria-labelledby="editor-title">
          <div class="panel-head">
            <h2 class="panel-title" id="editor-title">編集</h2>
          </div>
          <div class="panel-body">
            <div class="token-list" id="tokenList">
              <p class="empty">入力して「変換」を押すと、ここに編集項目が表示されます。</p>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span>HTML5 ruby / 青空文庫記法 / pixiv 形式のふりがなを生成します。</span>
        <span><a href="../privacy/">プライバシーポリシー</a></span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
    <script>
      const state = {
        tokenizer: null,
        tokens: [],
        mode: "group",
        kanjiYomi: null,
        outputFormat: "html"
      };

      const SAMPLE_TEXT = "新幹線で旅行を楽しむ。";
      const SAMPLE_FALLBACK_HTML = "<ruby>新幹線<rt>しんかんせん</rt></ruby>で<ruby>旅行<rt>りょこう</rt></ruby>を<ruby>楽<rt>たの</rt></ruby>しむ。";
      const SAMPLE_FALLBACK_AOZORA = "｜新幹線《しんかんせん》で｜旅行《りょこう》を｜楽《たの》しむ。";
      const SAMPLE_FALLBACK_PIXIV = "[[rb:新幹線 > しんかんせん]]で[[rb:旅行 > りょこう]]を[[rb:楽 > たの]]しむ。";

      const elements = {
        sourceText: document.getElementById("sourceText"),
        convertButton: document.getElementById("convertButton"),
        status: document.getElementById("status"),
        tokenList: document.getElementById("tokenList"),
        monoModeButton: document.getElementById("monoModeButton"),
        groupModeButton: document.getElementById("groupModeButton"),
        wholeModeButton: document.getElementById("wholeModeButton"),
        formatHtmlButton: document.getElementById("formatHtmlButton"),
        formatAozoraButton: document.getElementById("formatAozoraButton"),
        formatPixivButton: document.getElementById("formatPixivButton"),
        preview: document.getElementById("preview"),
        outputHtml: document.getElementById("outputHtml"),
        copyButton: document.getElementById("copyButton"),
        toast: document.getElementById("toast")
      };

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function katakanaToHiragana(value) {
        return String(value || "").replace(/[\u30a1-\u30f6]/g, (char) =>
          String.fromCharCode(char.charCodeAt(0) - 0x60)
        );
      }

      function normalizeReading(reading) {
        if (!reading || reading === "*") {
          return "";
        }
        return katakanaToHiragana(reading);
      }

      function isKanji(char) {
        return /[\u3400-\u9fff々〆]/.test(char);
      }

      function hasKanji(value) {
        return Array.from(value).some(isKanji);
      }

      function isKana(char) {
        return /[\u3041-\u3096\u309d\u309e\u30a1-\u30fa\u30fc\u30fd\u30fe]/.test(char);
      }

      function normalizeKana(value) {
        return katakanaToHiragana(value);
      }

      function splitSurfaceRuns(surface) {
        const chars = Array.from(surface);
        const runs = [];

        chars.forEach((char) => {
          const kind = isKanji(char) ? "kanji" : isKana(char) ? "kana" : "other";
          const lastRun = runs[runs.length - 1];

          if (lastRun && lastRun.kind === kind) {
            lastRun.text += char;
          } else {
            runs.push({ kind, text: char });
          }
        });

        return runs;
      }

      function getAlignedRuns(surface, reading) {
        const runs = splitSurfaceRuns(surface);
        const kanjiRunIndexes = runs
          .map((run, index) => (run.kind === "kanji" ? index : -1))
          .filter((index) => index >= 0);
        const kanaMatches = [];
        let cursor = 0;

        for (let index = 1; index < kanjiRunIndexes.length; index += 1) {
          const previousKanji = kanjiRunIndexes[index - 1];
          const currentKanji = kanjiRunIndexes[index];
          const hasKanaBoundary = runs
            .slice(previousKanji + 1, currentKanji)
            .some((run) => run.kind === "kana");

          if (!hasKanaBoundary) {
            return null;
          }
        }

        for (let index = 0; index < runs.length; index += 1) {
          const run = runs[index];
          if (run.kind !== "kana") {
            continue;
          }

          const normalized = normalizeKana(run.text);
          const foundAt = reading.indexOf(normalized, cursor);

          if (foundAt < 0) {
            return null;
          }

          kanaMatches[index] = {
            start: foundAt,
            end: foundAt + normalized.length
          };
          cursor = foundAt + normalized.length;
        }

        const htmlParts = [];

        for (let index = 0; index < runs.length; index += 1) {
          const run = runs[index];

          if (run.kind === "kanji") {
            let previousEnd = 0;
            let nextStart = reading.length;

            for (let before = index - 1; before >= 0; before -= 1) {
              if (kanaMatches[before]) {
                previousEnd = kanaMatches[before].end;
                break;
              }
            }

            for (let after = index + 1; after < runs.length; after += 1) {
              if (kanaMatches[after]) {
                nextStart = kanaMatches[after].start;
                break;
              }
            }

            const rt = reading.slice(previousEnd, nextStart);
            if (!rt) {
              return null;
            }
            htmlParts.push({ type: "kanji", text: run.text, reading: rt });
          } else {
            htmlParts.push({ type: run.kind, text: run.text });
          }
        }

        return htmlParts;
      }

      function buildSplitRuby(surface, reading) {
        const alignedRuns = getAlignedRuns(surface, reading);

        if (!alignedRuns) {
          return null;
        }

        return alignedRuns
          .map((run) => {
            if (run.type === "kanji") {
              return `<ruby>${escapeHtml(run.text)}<rt>${escapeHtml(run.reading)}</rt></ruby>`;
            }
            return escapeHtml(run.text);
          })
          .join("");
      }

      function buildSplitSegments(surface, reading) {
        const alignedRuns = getAlignedRuns(surface, reading);

        if (!alignedRuns) {
          return null;
        }

        return alignedRuns.map((run) => {
          if (run.type === "kanji") {
            return { ruby: true, base: run.text, reading: run.reading };
          }
          return { ruby: false, text: run.text };
        });
      }

      const rendakuMap = {
        か: ["が"],
        き: ["ぎ"],
        く: ["ぐ"],
        け: ["げ"],
        こ: ["ご"],
        さ: ["ざ"],
        し: ["じ"],
        す: ["ず"],
        せ: ["ぜ"],
        そ: ["ぞ"],
        た: ["だ"],
        ち: ["ぢ"],
        つ: ["づ"],
        て: ["で"],
        と: ["ど"],
        は: ["ば", "ぱ"],
        ひ: ["び", "ぴ"],
        ふ: ["ぶ", "ぷ"],
        へ: ["べ", "ぺ"],
        ほ: ["ぼ", "ぽ"]
      };

      function createSokuonVariant(candidate) {
        if (!/[くきちつ]$/.test(candidate)) {
          return "";
        }

        return `${candidate.slice(0, -1)}っ`;
      }

      function createRendakuVariants(candidate) {
        const firstChar = candidate.charAt(0);
        const replacements = rendakuMap[firstChar] || [];

        return replacements.map((replacement) => `${replacement}${candidate.slice(1)}`);
      }

      function createReadingMatchVariants(candidate, kanjiIndex, kanjiCount) {
        const variants = [{ match: candidate, output: candidate }];
        const sokuon = kanjiIndex < kanjiCount - 1 ? createSokuonVariant(candidate) : "";

        if (sokuon && sokuon !== candidate) {
          variants.push({ match: sokuon, output: candidate });
        }

        if (kanjiIndex > 0) {
          createRendakuVariants(candidate).forEach((rendaku) => {
            if (rendaku !== candidate) {
              variants.push({ match: rendaku, output: rendaku });
            }
          });
        }

        return variants;
      }

      function splitReadingByKanji(kanjiChars, groupReading, kanjiYomiDict) {
        if (!kanjiYomiDict || !groupReading || !kanjiChars.length) {
          return null;
        }

        const memo = new Map();

        function search(kanjiIndex, readingIndex) {
          const memoKey = `${kanjiIndex}:${readingIndex}`;
          if (memo.has(memoKey)) {
            return memo.get(memoKey);
          }

          if (kanjiIndex === kanjiChars.length) {
            const result = readingIndex === groupReading.length ? [] : null;
            memo.set(memoKey, result);
            return result;
          }

          const kanji = kanjiChars[kanjiIndex];
          const candidates = Array.isArray(kanjiYomiDict[kanji]) ? kanjiYomiDict[kanji] : [];

          for (const rawCandidate of candidates) {
            const candidate = normalizeReading(rawCandidate);
            if (!candidate) {
              continue;
            }

            const variants = createReadingMatchVariants(candidate, kanjiIndex, kanjiChars.length);
            for (const variant of variants) {
              if (!groupReading.startsWith(variant.match, readingIndex)) {
                continue;
              }

              const nextResult = search(kanjiIndex + 1, readingIndex + variant.match.length);
              if (nextResult) {
                const result = [variant.output, ...nextResult];
                memo.set(memoKey, result);
                return result;
              }
            }
          }

          memo.set(memoKey, null);
          return null;
        }

        return search(0, 0);
      }

      function createCharReadings(surface, reading) {
        const charReadings = {};
        const alignedRuns = getAlignedRuns(surface, reading);

        if (!alignedRuns) {
          return charReadings;
        }

        let charIndex = 0;
        alignedRuns.forEach((run) => {
          const chars = Array.from(run.text);

          if (run.type === "kanji") {
            if (chars.length === 1) {
              charReadings[charIndex] = run.reading || "";
            } else {
              const splitReadings = splitReadingByKanji(chars, run.reading, state.kanjiYomi);

              if (splitReadings) {
                chars.forEach((char, offset) => {
                  charReadings[charIndex + offset] = splitReadings[offset];
                });
              }
            }
          }

          charIndex += chars.length;
        });

        return charReadings;
      }

      function buildMonoRuby(token) {
        const charReadings = token.charReadings || {};
        const alignedRuns = getAlignedRuns(token.surface, token.reading);

        if (!alignedRuns) {
          return token.reading
            ? `<ruby>${escapeHtml(token.surface)}<rt>${escapeHtml(token.reading)}</rt></ruby>`
            : escapeHtml(token.surface);
        }

        let charIndex = 0;

        return alignedRuns
          .map((run) => {
            const chars = Array.from(run.text);

            if (run.type !== "kanji") {
              charIndex += chars.length;
              return escapeHtml(run.text);
            }

            const startIndex = charIndex;
            charIndex += chars.length;

            if (chars.every((char, offset) => charReadings[startIndex + offset])) {
              return chars
                .map((char, offset) => {
                  const rt = charReadings[startIndex + offset];
                  return `<ruby>${escapeHtml(char)}<rt>${escapeHtml(rt)}</rt></ruby>`;
                })
                .join("");
            }

            return `<ruby>${escapeHtml(run.text)}<rt>${escapeHtml(run.reading)}</rt></ruby>`;
          })
          .join("");
      }

      function buildMonoSegments(token) {
        const charReadings = token.charReadings || {};
        const alignedRuns = getAlignedRuns(token.surface, token.reading);

        if (!alignedRuns) {
          return token.reading
            ? [{ ruby: true, base: token.surface, reading: token.reading }]
            : [{ ruby: false, text: token.surface }];
        }

        let charIndex = 0;

        return alignedRuns.flatMap((run) => {
          const chars = Array.from(run.text);

          if (run.type !== "kanji") {
            charIndex += chars.length;
            return [{ ruby: false, text: run.text }];
          }

          const startIndex = charIndex;
          charIndex += chars.length;

          if (chars.every((char, offset) => charReadings[startIndex + offset])) {
            return chars.map((char, offset) => ({
              ruby: true,
              base: char,
              reading: charReadings[startIndex + offset]
            }));
          }

          return [{ ruby: true, base: run.text, reading: run.reading }];
        });
      }

      function tokenToHtml(token) {
        if (!token.hasKanji || token.style === "off") {
          return escapeHtml(token.surface);
        }

        if (token.style === "mono") {
          return buildMonoRuby(token);
        }

        if (!token.reading) {
          return escapeHtml(token.surface);
        }

        if (token.style === "whole") {
          return `<ruby>${escapeHtml(token.surface)}<rt>${escapeHtml(token.reading)}</rt></ruby>`;
        }

        return buildSplitRuby(token.surface, token.reading) ||
          `<ruby>${escapeHtml(token.surface)}<rt>${escapeHtml(token.reading)}</rt></ruby>`;
      }

      function tokenToSegments(token) {
        if (!token.hasKanji || token.style === "off") {
          return [{ ruby: false, text: token.surface }];
        }

        if (token.style === "mono") {
          return buildMonoSegments(token);
        }

        if (!token.reading) {
          return [{ ruby: false, text: token.surface }];
        }

        if (token.style === "whole") {
          return [{ ruby: true, base: token.surface, reading: token.reading }];
        }

        return buildSplitSegments(token.surface, token.reading) || [
          { ruby: true, base: token.surface, reading: token.reading }
        ];
      }

      function formatSegmentsHtml(segs) {
        return segs
          .map((seg) => {
            if (seg.ruby) {
              return `<ruby>${escapeHtml(seg.base)}<rt>${escapeHtml(seg.reading)}</rt></ruby>`;
            }
            return escapeHtml(seg.text);
          })
          .join("");
      }

      function formatSegmentsAozora(segs) {
        return segs
          .map((seg) => {
            if (seg.ruby) {
              return `｜${seg.base}《${seg.reading}》`;
            }
            return seg.text;
          })
          .join("");
      }

      function formatSegmentsPixiv(segs) {
        return segs
          .map((seg) => {
            if (seg.ruby) {
              return `[[rb:${seg.base} > ${seg.reading}]]`;
            }
            return seg.text;
          })
          .join("");
      }

      function serializeTokens(tokens, format) {
        return tokens
          .map((token) => {
            const segs = tokenToSegments(token);

            if (format === "aozora") {
              return formatSegmentsAozora(segs);
            }

            if (format === "pixiv") {
              return formatSegmentsPixiv(segs);
            }

            return formatSegmentsHtml(segs);
          })
          .join("");
      }

      function updateOutput() {
        const html = serializeTokens(state.tokens, "html");
        const output = serializeTokens(state.tokens, state.outputFormat);
        elements.preview.classList.remove("is-sample");
        elements.outputHtml.classList.remove("is-sample");
        elements.preview.innerHTML = html;
        elements.outputHtml.value = output;
        resizeTextarea(elements.outputHtml);
      }

      function isSampleOutput() {
        return elements.outputHtml.classList.contains("is-sample");
      }

      function buildSampleHtml() {
        if (!state.tokenizer) {
          return SAMPLE_FALLBACK_HTML;
        }

        return serializeTokens(tokenizePreservingWhitespace(SAMPLE_TEXT), "html");
      }

      function buildSampleOutput(format) {
        if (!state.tokenizer) {
          if (format === "aozora") {
            return SAMPLE_FALLBACK_AOZORA;
          }

          if (format === "pixiv") {
            return SAMPLE_FALLBACK_PIXIV;
          }

          return SAMPLE_FALLBACK_HTML;
        }

        return serializeTokens(tokenizePreservingWhitespace(SAMPLE_TEXT), format);
      }

      function updateSampleOutput() {
        const html = buildSampleHtml();
        const output = buildSampleOutput(state.outputFormat);

        elements.preview.classList.add("is-sample");
        elements.outputHtml.classList.add("is-sample");
        elements.preview.innerHTML = `例: ${html}`;
        elements.outputHtml.value = `例: ${output}`;
        resizeTextarea(elements.outputHtml);
      }

      function createToken(sourceToken, id) {
        const surface = sourceToken.surface_form || "";
        const tokenHasKanji = hasKanji(surface);
        const reading = tokenHasKanji ? normalizeReading(sourceToken.reading) : "";

        return {
          id,
          surface,
          hasKanji: tokenHasKanji,
          reading,
          charReadings: tokenHasKanji ? createCharReadings(surface, reading) : {},
          style: tokenHasKanji ? state.mode : "off"
        };
      }

      function isKanaOnly(value) {
        return Array.from(value).every(isKana);
      }

      function shouldMergeBaseToken(token) {
        const surface = token.surface_form || "";

        return hasKanji(surface) && ["動詞", "形容詞", "助動詞"].includes(token.pos);
      }

      function shouldMergeTrailingToken(token) {
        const surface = token.surface_form || "";

        if (!surface || hasKanji(surface) || !isKanaOnly(surface)) {
          return false;
        }

        return token.pos === "助動詞" || (token.pos === "助詞" && token.pos_detail_1 === "接続助詞");
      }

      function mergeReading(baseToken, nextToken) {
        const baseReading = baseToken.reading && baseToken.reading !== "*" ? baseToken.reading : "";
        const nextReading = nextToken.reading && nextToken.reading !== "*" ? nextToken.reading : nextToken.surface_form;

        return `${baseReading}${nextReading}`;
      }

      function mergeInflectionTokens(sourceTokens) {
        const merged = [];

        for (let index = 0; index < sourceTokens.length; index += 1) {
          const current = { ...sourceTokens[index] };

          if (shouldMergeBaseToken(current)) {
            while (sourceTokens[index + 1] && shouldMergeTrailingToken(sourceTokens[index + 1])) {
              const nextToken = sourceTokens[index + 1];
              current.surface_form += nextToken.surface_form || "";
              current.reading = mergeReading(current, nextToken);
              index += 1;
            }
          }

          merged.push(current);
        }

        return merged;
      }

      function tokenizePreservingWhitespace(text) {
        const pieces = text.split(/(\s+)/u);
        const tokens = [];
        let id = 0;

        pieces.forEach((piece) => {
          if (!piece) {
            return;
          }

          if (/^\s+$/u.test(piece)) {
            tokens.push({
              id,
              surface: piece,
              hasKanji: false,
              reading: "",
              charReadings: {},
              style: "off"
            });
            id += 1;
            return;
          }

          mergeInflectionTokens(state.tokenizer.tokenize(piece)).forEach((token) => {
            tokens.push(createToken(token, id));
            id += 1;
          });
        });

        return tokens;
      }

      function renderEditor() {
        if (!state.tokens.length) {
          elements.tokenList.innerHTML = '<p class="empty">入力して「変換」を押すと、ここに編集項目が表示されます。</p>';
          return;
        }

        elements.tokenList.innerHTML = state.tokens
          .map((token) => {
            if (!token.hasKanji) {
              return `
                <div class="token-row">
                  <span class="token-surface">${escapeHtml(token.surface)}</span>
                  <span class="muted-label">ルビ対象外</span>
                  <span></span>
                </div>
              `;
            }

            const kanjiCount = Array.from(token.surface).filter(isKanji).length;
            const monoDisabled = kanjiCount <= 1 ? " disabled" : "";
            const styleButtons = [
              { value: "mono", label: "モノ", disabled: monoDisabled },
              { value: "group", label: "グループ", disabled: "" },
              { value: "whole", label: "まるごと", disabled: "" },
              { value: "off", label: "OFF", disabled: "" }
            ]
              .map(
                (item) => `
                  <button
                    type="button"
                    data-style-id="${token.id}"
                    data-style-value="${item.value}"
                    aria-pressed="${token.style === item.value ? "true" : "false"}"${item.disabled}
                  >${item.label}</button>
                `
              )
              .join("");

            const readingControl =
              token.style === "mono"
                ? renderCharReadingControls(token)
                : token.style === "off"
                  ? '<span class="muted-label">ルビOFF</span>'
                  : `<label class="reading-field">読み<input type="text" data-reading-id="${token.id}" value="${escapeHtml(token.reading)}" placeholder="ひらがなで入力" /></label>`;

            return `
              <div class="token-row">
                <span class="token-surface">${escapeHtml(token.surface)}</span>
                ${readingControl}
                <div class="style-segment" role="group" aria-label="${escapeHtml(token.surface)}のルビモード">
                  ${styleButtons}
                </div>
              </div>
            `;
          })
          .join("");
      }

      function renderCharReadingControls(token) {
        const charReadings = token.charReadings || {};
        const controls = Array.from(token.surface)
          .map((char, index) => {
            if (!isKanji(char)) {
              return "";
            }

            return `
              <label class="char-reading-field">
                <span class="char-label">${escapeHtml(char)}</span>
                <input
                  type="text"
                  data-charreading-id="${token.id}"
                  data-charpos="${index}"
                  value="${escapeHtml(charReadings[index] || "")}"
                  aria-label="${escapeHtml(char)}の読み"
                  placeholder="${charReadings[index] ? "" : "グループ表示"}"
                />
              </label>
            `;
          })
          .join("");

        return `<div class="char-readings">${controls}</div>`;
      }

      function convertText() {
        if (!state.tokenizer) {
          showStatus("辞書の読み込みが完了していません", true);
          return;
        }

        resizeTextarea(elements.sourceText);
        state.tokens = tokenizePreservingWhitespace(elements.sourceText.value);
        renderEditor();
        updateOutput();
      }

      function setMode(mode) {
        state.mode = mode;
        elements.monoModeButton.setAttribute("aria-pressed", String(mode === "mono"));
        elements.groupModeButton.setAttribute("aria-pressed", String(mode === "group"));
        elements.wholeModeButton.setAttribute("aria-pressed", String(mode === "whole"));
        state.tokens.forEach((token) => {
          if (token.hasKanji) {
            token.style = mode;
          }
        });
        if (isSampleOutput()) {
          updateSampleOutput();
          return;
        }
        renderEditor();
        updateOutput();
      }

      function setFormat(format) {
        state.outputFormat = format;
        elements.formatHtmlButton.setAttribute("aria-pressed", String(format === "html"));
        elements.formatAozoraButton.setAttribute("aria-pressed", String(format === "aozora"));
        elements.formatPixivButton.setAttribute("aria-pressed", String(format === "pixiv"));

        if (isSampleOutput()) {
          updateSampleOutput();
          return;
        }

        updateOutput();
      }

      function showStatus(message, isError = false) {
        elements.status.textContent = message;
        elements.status.classList.toggle("status-error", isError);
      }

      let toastTimer = 0;

      function showToast(message) {
        window.clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.classList.add("is-visible");
        toastTimer = window.setTimeout(() => {
          elements.toast.classList.remove("is-visible");
        }, 1800);
      }

      function resizeTextarea(el) {
        el.style.height = "auto";
        el.style.height = `${el.scrollHeight}px`;
      }

      function resizeAutoGrowTextareas() {
        resizeTextarea(elements.sourceText);
        resizeTextarea(elements.outputHtml);
      }

      elements.sourceText.addEventListener("input", () => resizeTextarea(elements.sourceText));
      elements.convertButton.addEventListener("click", convertText);

      elements.tokenList.addEventListener("input", (event) => {
        const readingInput = event.target.closest("[data-reading-id]");
        const charReadingInput = event.target.closest("[data-charreading-id]");

        if (readingInput) {
          const id = Number(readingInput.dataset.readingId);
          const token = state.tokens.find((item) => item.id === id);

          if (token) {
            const normalized = katakanaToHiragana(readingInput.value.trim());
            token.reading = normalized;
            readingInput.value = normalized;
            updateOutput();
          }
          return;
        }

        if (charReadingInput) {
          const id = Number(charReadingInput.dataset.charreadingId);
          const charPosition = Number(charReadingInput.dataset.charpos);
          const token = state.tokens.find((item) => item.id === id);

          if (token) {
            const normalized = katakanaToHiragana(charReadingInput.value.trim());
            token.charReadings = token.charReadings || {};
            token.charReadings[charPosition] = normalized;
            charReadingInput.value = normalized;
            updateOutput();
          }
          return;
        }
      });

      elements.tokenList.addEventListener("click", (event) => {
        const styleButton = event.target.closest("[data-style-id]");
        if (!styleButton) {
          return;
        }

        const id = Number(styleButton.dataset.styleId);
        const token = state.tokens.find((item) => item.id === id);

        if (token && token.hasKanji) {
          token.style = styleButton.dataset.styleValue;
          renderEditor();
          updateOutput();
        }
      });

      elements.monoModeButton.addEventListener("click", () => setMode("mono"));
      elements.groupModeButton.addEventListener("click", () => setMode("group"));
      elements.wholeModeButton.addEventListener("click", () => setMode("whole"));
      elements.formatHtmlButton.addEventListener("click", () => setFormat("html"));
      elements.formatAozoraButton.addEventListener("click", () => setFormat("aozora"));
      elements.formatPixivButton.addEventListener("click", () => setFormat("pixiv"));

      elements.copyButton.addEventListener("click", async () => {
        if (elements.outputHtml.classList.contains("is-sample")) {
          showToast("変換してから利用してください");
          return;
        }

        try {
          await navigator.clipboard.writeText(elements.outputHtml.value);
          showToast("コピーしました");
        } catch (error) {
          showToast("コピーできませんでした");
        }
      });

      function loadDictionary() {
        if (!window.kuromoji) {
          showStatus("kuromoji を読み込めませんでした", true);
          return;
        }

        window.kuromoji
          .builder({ dicPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/" })
          .build((error, tokenizer) => {
            if (error) {
              showStatus("辞書の読み込みに失敗しました", true);
              return;
            }

            state.tokenizer = tokenizer;
            elements.convertButton.disabled = false;
            showStatus("辞書の読み込みが完了しました");
            if (isSampleOutput()) {
              updateSampleOutput();
            }
          });
      }

      function loadKanjiYomi() {
        const fetchJson = window.fetch
          ? window.fetch.bind(window)
          : typeof fetch === "function"
            ? fetch
            : null;

        if (!fetchJson) {
          return Promise.resolve();
        }

        return fetchJson("./data/kanji-yomi.json")
          .then((response) => (response.ok ? response.json() : null))
          .then((data) => {
            if (data && typeof data === "object" && !Array.isArray(data)) {
              state.kanjiYomi = data;
              if (isSampleOutput()) {
                updateSampleOutput();
              }
            }
          })
          .catch(() => {});
      }

      // レイアウト確定後に初期高さを計算する(確定前だと幅0で誤った高さになるため)
      requestAnimationFrame(() => requestAnimationFrame(resizeAutoGrowTextareas));
      window.addEventListener("load", resizeAutoGrowTextareas);
      window.addEventListener("resize", resizeAutoGrowTextareas);
      loadKanjiYomi();
      loadDictionary();
    </script>
  </body>
</html>
